
name: Build VoidSpaceBridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build plugin
        run: gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidSpaceBridge-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
